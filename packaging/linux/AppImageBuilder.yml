version: 1

AppDir:
  app_info:
    id: yagua
    name: Yagua
    icon: yagua
    version: !ENV '${APP_VERSION}'
    exec: usr/lib/yagua/Yagua
    exec_args: $@

  apt:
    arch:
      - amd64
    sources:
      - sourceline: "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse"
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
    include:
      - libxext6
      - libxrender1
      - libx11-6
      - libfontconfig1
      - libxft2
      - libfreetype6
      - libgomp1

  files:
    exclude:
      - usr/share/man
      - usr/share/doc/*/README.*
      - usr/share/doc/*/changelog.*
      - usr/share/doc/*/NEWS.*
      - usr/share/doc/*/TODO.*
      - usr/share/lintian

AppImage:
  arch: x86_64
  file_name: !ENV 'Yagua-${APP_VERSION}-x86_64.AppImage'
