name: Release (Windows)

on:
  push:
    tags:
      - "win-v*.*.*"
      - "win-v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z (sin 'v')"
        required: true

permissions:
  contents: write

jobs:
  build_release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".Trim()
          } else {
            $v = "${{ github.ref_name }}".Trim()
            if ($v.StartsWith("win-v")) { $v = $v.Substring(5) }
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          if ($v.Contains("-")) {
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          }
          Write-Host "Version=$v"

      - name: Apply version to files (CI-only)
        shell: pwsh
        run: |
          python scripts/ci/apply_version.py "${{ steps.ver.outputs.version }}" windows

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install -U pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint and type check
        shell: pwsh
        run: |
          ruff check app tests scripts
          if ($LASTEXITCODE -ne 0) { throw 'Ruff failed' }
          $pythonPath = (Get-Command python).Source
          pyright --pythonpath $pythonPath app

      - name: Pytest
        shell: pwsh
        run: |
          python scripts/verify.py -q

      - name: Build (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm Yagua.spec

      - name: Verify packaged Windows runtime and UI
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'yagua-profile'
          $env:U2NET_HOME = Join-Path $env:RUNNER_TEMP 'yagua-models'
          $env:EASYOCR_MODULE_PATH = Join-Path $env:RUNNER_TEMP 'yagua-ocr'
          $env:YAGUA_PACKAGE_SELFTEST = Join-Path $env:RUNNER_TEMP 'windows-package-report.json'
          $env:YAGUA_PACKAGE_SELFTEST_MODE = 'full'
          $process = Start-Process -FilePath 'dist/Yagua/Yagua.exe' -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(900000)) { $process.Kill(); throw 'Package verification timed out' }
          if (-not (Test-Path $env:YAGUA_PACKAGE_SELFTEST)) { throw 'Package verification report missing' }
          $report = Get-Content $env:YAGUA_PACKAGE_SELFTEST -Raw | ConvertFrom-Json
          if ($report.status -ne 'passed') { throw ($report | ConvertTo-Json -Depth 10) }
          Remove-Item Env:YAGUA_PACKAGE_SELFTEST

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          iscc Yagua.iss

      - name: Package portable zip + hashes
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $setup = "installer\\Yagua_Setup_$ver.exe"
          if (-not (Test-Path $setup)) { throw "No se encontro instalador: $setup" }

          $portable = "installer\\Yagua_Portable_$ver.zip"
          if (Test-Path $portable) { Remove-Item -Force $portable }
          Compress-Archive -Path "dist\\Yagua\\*" -DestinationPath $portable

          $h1 = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $h2 = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLower()

          "$h1  $(Split-Path -Leaf $setup)" | Out-File -Encoding ascii "$setup.sha256"
          "$h2  $(Split-Path -Leaf $portable)" | Out-File -Encoding ascii "$portable.sha256"

          python scripts/ci/make_latest_json.py $ver (Split-Path -Leaf $setup) $h1 (Split-Path -Leaf $portable) $h2 | Out-File -Encoding utf8 "installer\\latest.json"

      - name: Release notes
        shell: pwsh
        run: |
          python scripts/ci/extract_release_notes.py "${{ steps.ver.outputs.version }}" | Out-File -Encoding utf8 "release_notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ steps.ver.outputs.version }}
          name: Windows v${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          body_path: release_notes.md
          files: |
            installer/Yagua_Setup_${{ steps.ver.outputs.version }}.exe
            installer/Yagua_Setup_${{ steps.ver.outputs.version }}.exe.sha256
            installer/Yagua_Portable_${{ steps.ver.outputs.version }}.zip
            installer/Yagua_Portable_${{ steps.ver.outputs.version }}.zip.sha256
            installer/latest.json
