name: Validated candidates (no publication)
# Valida primero el origen y después construye los candidatos por plataforma.
'on':
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version already recorded in this commit
        required: true
        default: 2.0.0
      resume_run_id:
        description: Previous run to recover compatible stages
        required: false
        default: ''
      force_rebuild:
        description: Ignore all checkpoints
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: candidates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13.17'
    - name: Require the committed version
      id: version
      env:
        CANDIDATE_VERSION: ${{ inputs.version }}
      run: |
        python - <<'PY'
        import os
        from app.version import __version__
        requested = os.environ['CANDIDATE_VERSION']
        if requested and requested != __version__:
            raise SystemExit('Commit the candidate version before building')
        if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{__version__}':
            raise SystemExit('Tag differs from the committed version')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'version={__version__}\n')
        PY
  windows:
    needs: source
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.source.outputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
  linux:
    needs: source
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.source.outputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
