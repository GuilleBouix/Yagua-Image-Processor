name: Build Windows candidate (no publication)
# Construye el candidato por etapas y conserva artefactos para reanudarlo.
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Version already recorded in source
        required: true
      resume_run_id:
        description: Previous run to recover compatible stages
        required: false
        default: ''
      force_rebuild:
        description: Ignore all checkpoints
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      resume_run_id:
        type: string
        default: ''
      force_rebuild:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  validate:
    uses: ./.github/workflows/validation.yml
    with:
      platform: windows
      version: ${{ inputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild }}
  compile:
    needs: validate
    uses: ./.github/workflows/stage.yml
    with:
      stage: compile
      platform: windows
      version: ${{ inputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild }}
      dependencies: '{"quality":"${{ needs.validate.outputs.quality }}","core":"${{ needs.validate.outputs.core }}","ui":"${{ needs.validate.outputs.ui }}"}'
  package:
    needs: compile
    uses: ./.github/workflows/stage.yml
    with:
      stage: package
      platform: windows
      version: ${{ inputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild }}
      dependencies: '{"compile":"${{ needs.compile.outputs.artifact_id }}"}'
  probe:
    needs: package
    uses: ./.github/workflows/stage.yml
    with:
      stage: probe
      platform: windows
      version: ${{ inputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild }}
      dependencies: '{"package":"${{ needs.package.outputs.artifact_id }}"}'
  installer:
    needs: package
    uses: ./.github/workflows/stage.yml
    with:
      stage: installer
      platform: windows
      version: ${{ inputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild }}
      dependencies: '{"package":"${{ needs.package.outputs.artifact_id }}"}'
  sources:
    needs: validate
    uses: ./.github/workflows/stage.yml
    with:
      stage: sources
      platform: windows
      version: ${{ inputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild }}
  deliver:
    needs:
    - validate
    - package
    - probe
    - sources
    - installer
    uses: ./.github/workflows/stage.yml
    with:
      stage: deliver
      platform: windows
      version: ${{ inputs.version }}
      resume_run_id: ${{ inputs.resume_run_id }}
      force_rebuild: ${{ inputs.force_rebuild }}
      dependencies: '{"quality":"${{ needs.validate.outputs.quality }}","core":"${{ needs.validate.outputs.core }}","ui":"${{ needs.validate.outputs.ui }}","package":"${{ needs.package.outputs.artifact_id }}","probe":"${{ needs.probe.outputs.artifact_id }}","sources":"${{ needs.sources.outputs.artifact_id }}","installer":"${{ needs.installer.outputs.artifact_id }}"}'
