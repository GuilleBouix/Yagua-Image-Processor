name: Publish validated Linux candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the previously validated candidate"
        required: true
      candidate_run_id:
        description: "Successful candidate workflow run ID; never rebuilds"
        required: true
      candidate_commit:
        description: "Full commit SHA recorded in the candidate manifest"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Download the approved candidate
        uses: actions/download-artifact@v4
        with:
          name: linux-validated-${{ inputs.version }}
          path: release/
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify version, source and exact artifact hashes
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python scripts/ci/candidate_manifest.py --verify release/candidate-linux.json --version "$CANDIDATE_VERSION" --commit "$CANDIDATE_COMMIT" --run-id "$CANDIDATE_RUN_ID"
      - name: Publish existing validated files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-v${{ inputs.version }}
          target_commitish: ${{ inputs.candidate_commit }}
          name: Linux v${{ inputs.version }}
          prerelease: ${{ contains(inputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/Yagua-*.AppImage
            release/Yagua-*.sha256
            release/validation.md
