name: Legacy Linux publisher (use joint release workflow)
# La publicaciÃ³n verifica el manifiesto y hashes del candidato existente.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the previously validated candidate"
        required: true
      candidate_run_id:
        description: "Successful candidate workflow run ID; never rebuilds"
        required: true
      candidate_commit:
        description: "Full commit SHA recorded in the candidate manifest"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  redirect:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo "Use release.yml to prepare one joint Windows/Linux draft release."
