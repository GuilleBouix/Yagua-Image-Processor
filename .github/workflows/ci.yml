name: CI
# Los dos jobs llaman a la misma validación para comprobar Windows y Linux.
'on':
  push:
    branches:
    - main
  pull_request: null
permissions:
  contents: read
  actions: read
jobs:
  test-windows:
    uses: ./.github/workflows/validation.yml
    with:
      platform: windows
  test-linux:
    uses: ./.github/workflows/validation.yml
    with:
      platform: linux
