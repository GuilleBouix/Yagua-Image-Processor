name: Lean runtime validation (no publication)

on:
  push:
    branches: [codex/lean-runtime]
    paths-ignore: ["audit/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      YAGUA_REQUIRE_UI: "1"
      PIP_RETRIES: "3"
      PIP_DEFAULT_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux build dependencies
        id: system-deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y python3-tk xvfb xauth fonts-dejavu-core file desktop-file-utils libfuse2 patchelf squashfs-tools binutils fakeroot strace zsync libgdk-pixbuf2.0-dev libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libgtk-3-0 libgomp1
      - name: Create isolated test environment
        id: test-env
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/yagua-tests"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            p="$RUNNER_TEMP/yagua-tests/Scripts/python.exe"
            requirements=requirements.txt
          else
            p="$RUNNER_TEMP/yagua-tests/bin/python"
            requirements=requirements-linux-cpu.txt
          fi
          test -f "$p"
          echo "python_path=$p" >> "$GITHUB_OUTPUT"
          "$p" -m pip install -r "$requirements" -r requirements-dev.txt
          "$p" -m pip check
      - name: Lint
        id: lint
        shell: bash
        run: |
          p="${{ steps.test-env.outputs.python_path }}"
          "$p" -m ruff check app tests scripts
      - name: Type check
        id: types
        shell: bash
        run: |
          p="${{ steps.test-env.outputs.python_path }}"
          "$p" -m pyright --pythonpath "$p" app
      - name: Tests with required UI
        id: tests
        shell: bash
        run: |
          p="${{ steps.test-env.outputs.python_path }}"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a -e "$RUNNER_TEMP/yagua-xvfb-tests.log" "$p" scripts/verify.py -q
          else
            "$p" scripts/verify.py -q
          fi
      - name: Baseline and candidate frozen packages, online, offline and size
        id: packages
        run: python scripts/ci/validate_lean_runtime.py --reports lean-reports
      - name: Collect diagnostics
        if: always()
        shell: bash
        env:
          CHECK_CHECKOUT: ${{ steps.checkout.outcome }}
          CHECK_PYTHON: ${{ steps.python.outcome }}
          CHECK_SYSTEM: ${{ steps.system-deps.outcome }}
          CHECK_INSTALL: ${{ steps.test-env.outcome }}
          CHECK_LINT: ${{ steps.lint.outcome }}
          CHECK_TYPES: ${{ steps.types.outcome }}
          CHECK_TESTS: ${{ steps.tests.outcome }}
          CHECK_PACKAGES: ${{ steps.packages.outcome }}
        run: |
          python - <<'PY'
          import json, os, platform, shutil, sys
          from pathlib import Path
          reports = Path('lean-reports')
          reports.mkdir(exist_ok=True)
          report = {
              'commit': os.environ['GITHUB_SHA'], 'platform': platform.platform(),
              'python': sys.version, 'run_id': os.environ['GITHUB_RUN_ID'],
              'steps': {name: os.environ[f'CHECK_{name.upper()}']
                        for name in ('checkout', 'python', 'system', 'install', 'lint', 'types', 'tests', 'packages')},
          }
          (reports / 'diagnostics.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          x_log = Path(os.environ['RUNNER_TEMP']) / 'yagua-xvfb-tests.log'
          if x_log.exists():
              shutil.copy2(x_log, reports / 'xvfb-tests.log')
          print(json.dumps(report, indent=2))
          PY
      - name: Upload measurements and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-runtime-${{ runner.os }}
          path: lean-reports/
          retention-days: 14
          if-no-files-found: warn
